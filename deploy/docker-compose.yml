# =============================================================================
# docker-compose.yml  —  One-command backend stack (local + prod-style)
#
#   docker compose up -d          # start postgres + redis + traccar + api + worker
#   docker compose down -v        # stop and wipe volumes
#
# Production runs on AWS EKS via deploy/k8s/* (decision A1.10); this compose file is the
# local one-command equivalent that mirrors the production container layout.
#
# Override any value via a `deploy/.env` file (compose loads it automatically).
# =============================================================================

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pg_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fleet}
    ports:
      - "${POSTGRES_PORT:-5444}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
      - ../db/schema:/docker-entrypoint-initdb.d/schema:ro
      - ../db/seed:/docker-entrypoint-initdb.d/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    # C5.4: Postgres needs shared memory; dind/CI runners default to small /dev/shm.
    shm_size: '256m'

  redis:
    image: redis:7-alpine
    # C5.10: AOF enabled so the telemetry buffer survives a restart.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  traccar:
    image: traccar/traccar:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # N2.1/N2.2: Traccar uses its OWN database on the same Postgres instance.
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://postgres:5432/traccar
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pg_local_dev}
      # N2.3: durable forward to a Redis Stream.
      FORWARD_REDIS_ENABLED: "true"
      FORWARD_REDIS_URI: redis://redis:6379/0
      FORWARD_REDIS_CHANNEL: traccar:positions
    ports:
      - "8082:8082"     # Traccar web UI (device provisioning)
      - "5005:5005"     # default tracker port (informational; trackers are user-supplied)
    volumes:
      - traccardata:/opt/traccar/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      traccar:
        condition: service_healthy
    environment:
      PORT: ${API_PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pg_local_dev}@postgres:5432/fleet
      REDIS_URL: redis://redis:6379/0
      TRACCAR_BASE_URL: http://traccar:8082
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      JWT_KID: ${JWT_KID:-k1}
      JWT_KID_PREVIOUS: ${JWT_KID_PREVIOUS:-k0}
      JWT_ISSUER: ${JWT_ISSUER:-fleet-api}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      SECURITY_ENFORCE: ${SECURITY_ENFORCE:-always}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      NODE_ENV: ${NODE_ENV:-production}
      SERVICE_NAME: fleet-api
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Clerk (managed auth) — optional until configured; auth routes fail-secure (401) until set.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_FRONTEND_URL: ${CLERK_FRONTEND_URL:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      CLERK_JWT_AUDIENCE: ${CLERK_JWT_AUDIENCE:-}
      CLERK_CLOCK_SKEW_IN_MS: ${CLERK_CLOCK_SKEW_IN_MS:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      # Traccar provisioning credentials.
      TRACCAR_USERNAME: ${TRACCAR_USERNAME:-admin}
      TRACCAR_PASSWORD: ${TRACCAR_PASSWORD:-admin}
      # Media / S3 (degrade to local/dev when credentials absent).
      AWS_REGION: ${AWS_REGION:-af-south-1}
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-fleet-media-local}
      S3_ACCIDENT_BUCKET: ${S3_ACCIDENT_BUCKET:-fleet-accident-evidence-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Email / SMS (optional; degrade to console/no-op).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-fleet@fleet.internal}
      AFRICAS_TALKING_API_KEY: ${AFRICAS_TALKING_API_KEY:-}
      AFRICAS_TALKING_USERNAME: ${AFRICAS_TALKING_USERNAME:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CONSENT_REQUIRED_VERSION: ${CONSENT_REQUIRED_VERSION:-2026.1}
    ports:
      - "${API_PORT:-4000}:4000"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: prod
    depends_on:
      - postgres
      - redis
      - api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pg_local_dev}@postgres:5432/fleet
      REDIS_URL: redis://redis:6379/0
      TRACCAR_BASE_URL: http://traccar:8082
      NODE_ENV: ${NODE_ENV:-production}
      SERVICE_NAME: fleet-worker
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRACCAR_USERNAME: ${TRACCAR_USERNAME:-admin}
      TRACCAR_PASSWORD: ${TRACCAR_PASSWORD:-admin}
      AWS_REGION: ${AWS_REGION:-af-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AFRICAS_TALKING_API_KEY: ${AFRICAS_TALKING_API_KEY:-}

volumes:
  pgdata:
  redisdata:
  traccardata:
