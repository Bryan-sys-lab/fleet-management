name: release-mobile

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: tag-triggered mobile release (local build + GitHub Release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Caches (the reason later builds are fast) ──────────────────────────────────
      - name: Cache npm (root + mobile)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            mobile/packages/mobile/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json', 'mobile/packages/mobile/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Gradle (Android deps — the big one)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/packages/mobile/package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk
          key: ${{ runner.os }}-ndk-27.1.12297006
          restore-keys: |
            ${{ runner.os }}-ndk-

      - name: Cache turbo (backend package builds)
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            packages/*/.turbo
            packages/*/dist
            packages/*/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-turbo-${{ hashFiles('packages/*/package.json', 'packages/*/src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Defence-in-depth: tag ancestry guard
      - name: Tag ancestry guard
        run: |
          TARGET_SHA="${{ github.event.before }}"
          if [ "$TARGET_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::Force-push or new branch tag — ancestry check skipped."
            exit 0
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "::error::Tag does not point at a commit on main. Aborting."
            exit 1
          fi
          echo "Tag ancestry verified: commit is on main."

      # Defence-in-depth: tag <-> app version match
      - name: Tag version match guard
        run: |
          TAG_BODY="${TAG#v}"
          SEMVER="${TAG_BODY%%+*}"
          BUILD_NUM="${TAG_BODY##*+}"
          if [ "$SEMVER" = "$TAG_BODY" ]; then
            echo "::error::Tag must be v<semver>+<buildNumber>, e.g. v1.0.0+1"
            exit 1
          fi
          echo "Tag semver: $SEMVER, build number: $BUILD_NUM"
          PKG_VERSION=$(node -p "require('./mobile/packages/mobile/package.json').version" 2>/dev/null || echo "")
          echo "App package version: $PKG_VERSION"
          if [ "$SEMVER" != "$PKG_VERSION" ]; then
            echo "::error::Tag semver ($SEMVER) does not match package version ($PKG_VERSION)."
            exit 1
          fi
          echo "Version match verified."

      # Defence-in-depth: no-reuse build number guard
      - name: Build number reuse guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_BODY="${TAG#v}"
          SEMVER="${TAG_BODY%%+*}"
          BUILD_NUM="${TAG_BODY##*+}"
          echo "Checking for existing releases of version $SEMVER..."
          EXISTING=$(gh release list --tag "v${SEMVER}+*" 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "::warning::Releases for $SEMVER already exist:"
            echo "$EXISTING"
          fi
          echo "Build number guard passed (idempotent re-runs allowed)."

      # Build all backend packages in dependency order
      - name: Build backend packages
        run: npm run build

      - name: Install mobile app dependencies
        run: |
          cd mobile/packages/mobile
          # node_modules is restored from cache when the cache key matches;
          # npm install then only fetches what changed (or nothing at all).
          npm install --prefer-offline --no-audit --no-fund

      - name: Mobile typecheck
        run: |
          cd mobile/packages/mobile
          npm run typecheck

      - name: Mobile unit tests
        run: |
          cd mobile/packages/mobile
          npm run test

      # Config validation for EAS
      - name: Validate EXPO configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is required for mobile releases."
            exit 1
          fi
          echo "EXPO_TOKEN is configured."

      # Build the APKs directly on this runner — no EAS cloud queue involved.
      # The compiled .apk lands in the repo root and is uploaded as an artifact below.
      - name: Set up Java 17 (AGP requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK (skips download if cached)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          # Locate sdkmanager wherever the runner put it
          SDKM=$(command -v sdkmanager || ls -1 "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          echo "Using sdkmanager at: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "cmake;3.22.1"
          if [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            echo "NDK $NDK_VERSION restored from cache — skipping download"
          else
            echo "NDK $NDK_VERSION not cached — downloading (this only happens once)"
            "$SDKM" "ndk;$NDK_VERSION"
          fi
          echo "$ANDROID_HOME" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          ls "$ANDROID_HOME/ndk/"

      - name: Build driver APK (local)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd mobile/packages/mobile
          npx eas-cli build \
            --platform android \
            --profile preview-driver \
            --local \
            --output ../../../helix-driver.apk \
            --non-interactive

      - name: Build admin APK (local)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd mobile/packages/mobile
          npx eas-cli build \
            --platform android \
            --profile preview-admin \
            --local \
            --output ../../../helix-admin.apk \
            --non-interactive

      - name: Verify APKs exist
        run: |
          ls -lh helix-driver.apk helix-admin.apk
          file helix-driver.apk helix-admin.apk

      # Upload as GitHub Actions artifacts so they survive after the run
      - name: Upload APKs as Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helix-preview-apks-${{ github.ref_name }}
          path: |
            helix-driver.apk
            helix-admin.apk
          if-no-files-found: error
          retention-days: 30

      # EAS submit (DISABLED - Play Store submission turned off for now)
      # - name: EAS submit to Google Play (driver)
      #   if: ${{ secrets.EAS_TOKEN != '' && secrets.PLAY_KEYSTORE_BASE64 != '' && secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
      #   env:
      #     EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
      #   run: |
      #     npx eas-cli submit \
      #       --platform android \
      #       --profile production-driver \
      #       --non-interactive

      # - name: EAS submit to Google Play (admin)
      #   if: ${{ secrets.EAS_TOKEN != '' && secrets.PLAY_KEYSTORE_BASE64 != '' && secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
      #   env:
      #     EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
      #   run: |
      #     npx eas-cli submit \
      #       --platform android \
      #       --profile production-admin \
      #       --non-interactive

      # Create GitHub Release (draft, idempotent re-runs)
      - name: Generate release notes
        id: notes
        run: |
          NOTES="Release $TAG\n\n## Changes since last release\n"
          NOTES+="$(git log --oneline --pretty=format:'- %s' $(git describe --tags --abbrev=0)..HEAD)\n"
          NOTES+="\n## Local Build (GitHub runner)\n- Platform: Android\n- Profiles: preview-driver, preview-admin\n- Artifacts: APK for device testing (also in Actions artifacts)\n- Keystore: helix-release (RSA-2048)\n- Play Store submission: DISABLED"
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_NOTES="Release ${{ github.ref_name }}\n\n## Changes since last release\n$(git log --oneline --pretty=format:'- %s' $(git describe --tags --abbrev=0)..HEAD 2>/dev/null || echo 'No previous tag found.')\n\n## Local Build (GitHub runner)\n- Platform: Android\n- Profiles: preview-driver, preview-admin\n- Artifacts: APK for device testing (also in Actions artifacts)\n- Play Store submission: DISABLED"
          gh release view "$TAG" 2>/dev/null && \
            gh release edit "$TAG" --draft=false --notes "$RELEASE_NOTES" --title "$TAG" || \
            gh release create "$TAG" --draft=true --title "$TAG" --notes "$RELEASE_NOTES" --repo "$GITHUB_REPOSITORY" || true
          echo "Release created or updated."

      - name: Attach APKs to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" helix-driver.apk helix-admin.apk --clobber --repo "$GITHUB_REPOSITORY" || true
          echo "APKs attached to release."

      - name: Publish release (finalize draft -> published)
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --draft=false
          echo "Release $TAG is now published."