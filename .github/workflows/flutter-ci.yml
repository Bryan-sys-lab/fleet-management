name: Flutter CI

on:
  push:
    branches: [final-app]
  pull_request:
    branches: [final-app]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    name: Analyze, test, and build Flutter app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get
        working-directory: flutter

      - name: Flutter analyze
        run: flutter analyze
        working-directory: flutter

      - name: Flutter test
        run: flutter test
        working-directory: flutter

      - name: Detect Android SDK location
        id: android-home
        run: |
          if [ -n "$ANDROID_HOME" ]; then
            echo "android-home=$ANDROID_HOME" >> $GITHUB_OUTPUT
          elif [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "android-home=$ANDROID_SDK_ROOT" >> $GITHUB_OUTPUT
          else
            echo "android-home=$HOME/Android/Sdk" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Accept Android SDK licenses
        run: |
          echo y | ${{ steps.android-home.outputs.android-home }}/cmdline-tools/latest/bin/sdkmanager --licenses || true
        shell: bash
        env:
          ANDROID_HOME: ${{ steps.android-home.outputs.android-home }}

      - name: Synthesize android/local.properties
        run: |
          cat > flutter/android/local.properties <<EOF
          sdk.dir=${{ steps.android-home.outputs.android-home }}
          flutter.sdk=${HOME}/flutter
          flutter.buildMode=release
          EOF
        shell: bash

      - name: Build Android APK (release)
        run: flutter build apk --release
        working-directory: flutter
