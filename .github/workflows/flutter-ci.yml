name: Flutter CI

on:
  push:
    branches: [final-app]
  pull_request:
    branches: [final-app]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    name: Analyze, test, and build Flutter app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter Android
        uses: ./.github/actions/setup-flutter-android
        with:
          flutter-channel: stable
          flutter-version: 3.47.5
          working-directory: flutter

      - name: Flutter pub upgrade (dry-run)
        run: flutter pub upgrade --dry-run
        working-directory: flutter

      - name: Flutter analyze
        run: flutter analyze --fatal-infos
        working-directory: flutter

      - name: Flutter test
        run: flutter test --reporter expanded
        working-directory: flutter

      - name: Build Android APK (release)
        if: secrets.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore.jks
          cat > android/key.properties <<EOF
          keyAlias=upload
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          storeFile=/tmp/keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF
          keytool -list -v -keystore /tmp/keystore.jks -alias upload -storepass "${{ secrets.KEYSTORE_PASSWORD }}"
          flutter build apk --release
        working-directory: flutter
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Build Android APK (release, debug signing)
        if: secrets.ANDROID_KEYSTORE_BASE64 == ''
        run: flutter build apk --release
        working-directory: flutter

      - name: Scrub signing material
        if: always()
        run: |
          rm -f /tmp/keystore.jks
          rm -f android/key.properties
        working-directory: flutter

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: helix-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
