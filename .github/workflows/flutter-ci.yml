name: Flutter CI

on:
  push:
    branches: [final-app]
  pull_request:
    branches: [final-app]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    name: Analyze, test, and build Flutter app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version
        working-directory: flutter

      - name: Flutter pub get
        run: flutter pub get
        working-directory: flutter

      - name: Flutter analyze
        run: flutter analyze
        working-directory: flutter

      - name: Flutter test
        run: flutter test
        working-directory: flutter

      - name: Get Flutter SDK path
        id: flutter-path
        run: echo "flutter-path=$(flutter sdk-path)" >> $GITHUB_OUTPUT
        working-directory: flutter

      - name: Check Flutter gradle plugin directory
        run: |
          FLUTTER_PATH=$(flutter sdk-path)
          echo "Flutter path: $FLUTTER_PATH"
          echo "--- packages/flutter_tools/gradle/ ---"
          ls -la "$FLUTTER_PATH/packages/flutter_tools/gradle/" 2>&1 || echo "NOT FOUND"
          echo "--- packages/flutter_tools/ ---"
          ls -la "$FLUTTER_PATH/packages/flutter_tools/" 2>&1 | head -20 || echo "NOT FOUND"
        working-directory: flutter

      - name: Detect Android SDK location
        id: android-home
        run: |
          if [ -n "$ANDROID_HOME" ]; then
            echo "android-home=$ANDROID_HOME" >> $GITHUB_OUTPUT
          elif [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "android-home=$ANDROID_SDK_ROOT" >> $GITHUB_OUTPUT
          else
            echo "android-home=$HOME/Android/Sdk" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Install Android SDK components
        run: |
          ${{ steps.android-home.outputs.android-home }}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
        shell: bash
        env:
          ANDROID_HOME: ${{ steps.android-home.outputs.android-home }}

      - name: Accept Android SDK licenses
        run: |
          echo y | ${{ steps.android-home.outputs.android-home }}/cmdline-tools/latest/bin/sdkmanager --licenses || true
        shell: bash
        env:
          ANDROID_HOME: ${{ steps.android-home.outputs.android-home }}

      - name: Synthesize android/local.properties
        run: |
          cat > flutter/android/local.properties <<EOF
          sdk.dir=${{ steps.android-home.outputs.android-home }}
          flutter.sdk=${{ steps.flutter-path.outputs.flutter-path }}
          flutter.buildMode=release
          EOF
        shell: bash

      - name: Show local.properties
        run: cat flutter/android/local.properties
        shell: bash

      - name: Build Android APK (debug)
        run: flutter build apk --debug --verbose -Pflutter.sdk=${{ steps.flutter-path.outputs.flutter-path }}
        working-directory: flutter
        env:
          ANDROID_HOME: ${{ steps.android-home.outputs.android-home }}
          FLUTTER_ROOT: ${{ steps.flutter-path.outputs.flutter-path }}
