name: Deploy Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gate:
    name: Build image, start stack, run Newman API tests
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:27-dind
        options: --privileged
    steps:
      - name: Checkout (full history for turbo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (prod target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: prod
          load: true
          tags: fleet-api:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
          progress: plain

      - name: Write env file for compose
        run: |
          cat > deploy/.env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=pg_local_dev
          POSTGRES_DB=fleet
          POSTGRES_PORT=5444
          REDIS_PORT=6379
          API_PORT=4000
          NODE_ENV=production
          SECURITY_ENFORCE=always
          TRUST_PROXY=true
          JWT_SECRET=draft-gate-secret-do-not-use-in-prod
          MFA_ENCRYPTION_KEY=
          WEBHOOK_SECRET=
          ALLOWED_ORIGINS=
          NODE_ENV=production
          LOG_LEVEL=warn
          CLERK_SECRET_KEY=
          CLERK_FRONTEND_URL=
          AWS_ACCESS_KEY_ID=
          AWS_SECRET_ACCESS_KEY=
          RESEND_API_KEY=
          AFRICAS_TALKING_API_KEY=
          EOF

      - name: Start the whole backend stack (api + postgres + redis + traccar + worker)
        run: |
          docker compose -f deploy/docker-compose.yml up -d
          echo "Waiting for API to become healthy..."
          timeout 90 bash -c 'until curl -sf http://localhost:4000/healthz >/dev/null 2>&1; do sleep 2; done'
          echo "API is healthy — running Newman tests."

      - name: Install Newman (Postman CLI)
        run: npm install -g newman@5.3.2

      - name: Run Newman against all APIs (security headers + fail-secure auth)
        run: |
          newman run deploy/postman/fleet-api.postman_collection.json \
            -e deploy/postman/fleet-api.postman_environment.json \
            --reporters cli,json \
            --reporter-json-export newman-results.json \
            --exit-code-on-test-failure

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: newman-results.json
          if-no-files-found: warn

      - name: Stop the backend stack
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml down -v
