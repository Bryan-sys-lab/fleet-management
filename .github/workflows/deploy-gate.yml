name: Deploy Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gate:
    name: Build image, start API, run Newman API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pg_local_dev
          POSTGRES_DB: fleet
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5444:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout (full history for turbo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -b across workspace)
        run: npm run build

      - name: Build backend Docker image (prod target) — verifies container compiles
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: prod
          load: true
          tags: fleet-api:local

      - name: Apply schema to throwaway Postgres
        continue-on-error: true
        run: npm run db:validate
        env:
          POSTGIS: shim
          PGURI: postgresql://postgres:pg_local_dev@localhost:5444/fleet

      - name: Start the API backend
        env:
          DATABASE_URL: postgresql://postgres:pg_local_dev@localhost:5444/fleet
          REDIS_URL: redis://localhost:6379/0
          PORT: 4000
          NODE_ENV: production
          SECURITY_ENFORCE: off
          JWT_SECRET: draft-gate-secret-do-not-use-in-prod
        run: |
          ls -la packages/api/dist/server.js
          node packages/api/dist/server.js > /tmp/api.log 2>&1 &
          API_PID=$!
          echo $! > /tmp/api.pid
          sleep 5
          if ! kill -0 $API_PID 2>/dev/null; then
            echo "API process died! Log:"
            cat /tmp/api.log
            exit 1
          fi
          echo "Waiting for API to become healthy..."
          timeout 90 bash -c 'until curl -sf http://localhost:4000/healthz >/dev/null 2>&1; do sleep 2; done'
          echo "API is healthy — running Newman tests."

      - name: Install Newman (Postman CLI)
        run: npm install -g newman@5.3.2

      - name: Run Newman against all APIs (security headers + fail-secure auth)
        run: |
          newman run deploy/postman/fleet-api.postman_collection.json \
            -e deploy/postman/fleet-api.postman_environment.json \
            --reporters cli,json \
            --reporter-json-export newman-results.json \
            --exit-code-on-test-failure

      - name: Stop the API backend
        if: always()
        run: |
          kill $(cat /tmp/api.pid) 2>/dev/null || true
          cat /tmp/api.log 2>/dev/null || true

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: newman-results.json
          if-no-files-found: warn
