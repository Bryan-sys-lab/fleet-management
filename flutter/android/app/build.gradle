plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { is -> localProperties.load(is) }
}

def flutterVersionCode = localProperties.getProperty('flutterVersionCode')?.toInteger() ?: 1
def flutterVersionName = localProperties.getProperty('flutterVersionName') ?: '1.0.0'

def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file('key.properties')
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withInputStream { is -> keyProperties.load(is) }
}

android {
    namespace 'com.helix.helix'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId 'com.helix.helix'
        minSdk 21
        targetSdk 36
        versionCode flutterVersionCode
        versionName flutterVersionName
    }
    signingConfigs {
        release {
            if (keyProperties.containsKey('storeFile')) {
                storeFile file(keyProperties['storeFile'])
                storePassword keyProperties['storePassword']
                keyAlias keyProperties['keyAlias']
                keyPassword keyProperties['keyPassword']
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.activity:activity:1.9.0'

    // Flutter engine library (manual dependency)
    def flutterRoot = System.getenv('FLUTTER_ROOT') ?: '/opt/flutter'
    ['android-arm64', 'android-arm', 'android-x86_64', 'android-x86'].each { arch ->
        def jarFile = new File("$flutterRoot/bin/cache/artifacts/engine/$arch/flutter.jar")
        if (jarFile.exists()) {
            implementation jarFile
        }
    }
}

flutter {
    source '../..'
}
